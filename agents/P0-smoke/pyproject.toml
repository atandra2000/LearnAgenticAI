[project]
name = "P0-smoke"
version = "0.0.0"
description = "P0 — Smoke test agent that proves the end-to-end plumbing works."
requires-python = ">=3.11,<3.13"
dependencies = [
    "common",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.7,<3",
    "sse-starlette>=2.1,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "respx>=0.21,<1",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/P0_smoke"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-ignore = ["N999"] # package name `P0_smoke` is mandated by the spec (matches the slug)

[tool.mypy]
strict = true
python_version = "3.11"
